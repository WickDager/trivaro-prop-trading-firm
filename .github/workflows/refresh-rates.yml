name: Refresh Crypto Rates
on:
  schedule:
    # Every 15 minutes. The stored quote is valid for 120 minutes, so this is
    # what keeps the Bitcoin rail warm — the checkout also refreshes a stale
    # quote itself, so a missed run only means the first Bitcoin buyer of the
    # window waits a second longer.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Least privilege: this job only runs curl, so the workflow token needs no
# write access to the repository.
permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh the BTC/USD quote
        env:
          # Public site URL, e.g. https://trivaro.com (repo variable APP_URL).
          APP_URL: ${{ vars.APP_URL }}
          # Must match CRON_SECRET in the web deployment's environment.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL repo variable and the CRON_SECRET secret before enabling this job."
            exit 1
          fi

          # A bare curl exits 0 on HTTP 401/503 too, so check the status code —
          # otherwise a rotated secret or an unpublished deployment would look
          # like a healthy job while Bitcoin stayed unavailable at checkout.
          code=$(curl -sS -o /tmp/rates.json -w '%{http_code}' -X POST \
            "$APP_URL/api/rates/refresh" \
            -H "Authorization: Bearer $CRON_SECRET" || echo 000)

          cat /tmp/rates.json
          if [ "$code" != "200" ]; then
            echo "::error::Rate refresh failed with HTTP $code"
            exit 1
          fi
          echo "Rate refresh OK (HTTP 200)"
