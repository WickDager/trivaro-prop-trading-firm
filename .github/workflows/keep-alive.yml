name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 0 */3 * *'
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent pause
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # Publishable key (sb_publishable_...). Works with the new Supabase
          # API key system; no legacy anon key needed for a read-only ping.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -s "$SUPABASE_URL/rest/v1/orders?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY"

