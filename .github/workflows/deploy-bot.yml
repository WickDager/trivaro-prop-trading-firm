name: Deploy Edge Functions
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-bot.yml'
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Fail fast with an actionable message. Without this, a rejected
      # credential surfaces from any later step as the opaque
      # `Invalid access token` Management API error.
      # Supabase personal access tokens can now carry an expiry date, so a
      # token minted long ago can silently stop working.
      - name: Preflight - validate credentials
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_REF:-}" ]; then
            echo "::error::Repository secret SUPABASE_PROJECT_REF is empty or not set."
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Repository secret SUPABASE_ACCESS_TOKEN is empty or not set."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF" || echo 000)
          case "$code" in
            200) echo "Credentials OK (project $PROJECT_REF reachable)." ;;
            401)
              echo "::error::Supabase rejected SUPABASE_ACCESS_TOKEN (HTTP 401). The token has most likely expired or been revoked. Create a new one at https://supabase.com/dashboard/account/tokens and update the repository secret SUPABASE_ACCESS_TOKEN (paste the raw token: no quotes, no trailing newline)."
              exit 1 ;;
            403)
              echo "::error::Token accepted but lacks permission for this project (HTTP 403). A scoped token needs Edge Functions: Read-write."
              exit 1 ;;
            404)
              echo "::error::Token cannot see project $PROJECT_REF (HTTP 404). Check the SUPABASE_PROJECT_REF secret and the token's org/project access."
              exit 1 ;;
            000)
              echo "::error::Could not reach the Supabase Management API (network/proxy failure)."
              exit 1 ;;
            *)
              echo "::error::Unexpected Supabase Management API response: HTTP $code."
              exit 1 ;;
          esac

          # A token can be scoped narrowly enough to read the project yet still
          # fail inside `functions deploy`, which lists existing functions first
          # and dies with `unexpected list functions status 403` (the opaque
          # `Missing required permission(s): edge_functions_read`). Probe the
          # exact call the CLI makes so the failure names the missing scope.
          fns_code=$(curl -sS -o /tmp/functions.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/functions" || echo 000)
          if [ "$fns_code" != "200" ]; then
            missing=$(tr -d '\n' < /tmp/functions.json 2>/dev/null | head -c 300 || true)
            echo "::error::The token can reach project $PROJECT_REF but cannot list Edge Functions (HTTP $fns_code). Deploy fails at its first step because it lists functions before uploading. Response: $missing"
            echo "::error::Fix: Dashboard → Account → Access Tokens → create a token scoped to this project with BOTH 'Edge Functions: Read' and 'Edge Functions: Read-write', then update the SUPABASE_ACCESS_TOKEN secret. Permissions are immutable — delete and recreate rather than editing."
            exit 1
          fi
          echo "Edge Functions permissions OK."

      # No `supabase link` needed: since CLI v2 the deploy command accepts
      # --project-ref directly, which is what the official GitHub Actions
      # example does. `link` only wrote .temp/linked-project.json (gitignored).
      - name: Deploy receive-trade
        run: supabase functions deploy receive-trade --project-ref "$PROJECT_REF" --use-api --import-map "./supabase/functions/import_map.json"
      - name: Deploy send-notification
        run: supabase functions deploy send-notification --project-ref "$PROJECT_REF" --use-api --import-map "./supabase/functions/import_map.json"
      # telegram-webhook now lives in this repo (it used to exist only in the
      # deployment folder, so no CI run could ever update it). It imports
      # ../_shared/security.ts, which is vendored here as well.
      - name: Deploy telegram-webhook
        run: supabase functions deploy telegram-webhook --project-ref "$PROJECT_REF" --use-api --import-map "./supabase/functions/import_map.json"
