<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF">
        <animate attributeName="stop-color" values="#00D9FF;#00FF88;#00D9FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#00FF88">
        <animate attributeName="stop-color" values="#00FF88;#00D9FF;#00FF88" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow1">
      <feGaussianBlur stdDeviation="3">
        <animate attributeName="stdDeviation" values="3;5;3" dur="3s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="120" fill="none"/>

  <!-- Animated hexagon icon -->
  <g transform="translate(20, 10)">
    <path d="M 50 5 L 90 25 L 90 75 L 50 95 L 10 75 L 10 25 Z" 
          fill="#0A1628" stroke="url(#grad1)" stroke-width="2.5" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" 
                        values="0 50 50; 360 50 50" dur="20s" repeatCount="indefinite"/>
    </path>

    <rect x="42" y="30" width="16" height="40" rx="3" fill="url(#grad1)" filter="url(#glow1)">
      <animate attributeName="height" values="40;45;40" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="30;27;30" dur="2s" repeatCount="indefinite"/>
    </rect>

    <line x1="50" y1="30" x2="50" y2="15" stroke="#00FF88" stroke-width="3" stroke-linecap="round">
      <animate attributeName="y2" values="15;10;15" dur="2s" repeatCount="indefinite"/>
    </line>

    <circle cx="65" cy="25" r="3" fill="#00FF88">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(125, 68)">
    <text x="0" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF">T</text>
    <text x="28" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">R</text>
    <text x="55" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">I</text>
    <text x="70" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#00D9FF">V</text>
    <text x="97" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">A</text>
    <text x="125" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">R</text>
    <text x="153" y="0" font-family="'Inter', system-ui, sans-serif" font-size="42" font-weight="700" fill="#00FF88">O</text>

    <line x1="97" y1="12" x2="125" y2="12" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="x2" values="125;130;125" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <text x="125" y="95" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#00D9FF" opacity="0.7" letter-spacing="3">PROP TRADING</text>
</svg>