<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Gradient for the icon -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D9FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background (transparent by default, shown here for preview) -->
  <rect width="400" height="120" fill="none"/>

  <!-- ICON: Stylized T as Candlestick + Shield -->
  <g transform="translate(20, 10)" filter="url(#shadow)">
    <!-- Outer shield/hexagon shape -->
    <path d="M 50 5 L 90 25 L 90 75 L 50 95 L 10 75 L 10 25 Z" 
          fill="#0A1628" 
          stroke="url(#iconGrad)" 
          stroke-width="2.5"
          opacity="0.9"/>

    <!-- Inner accent line -->
    <path d="M 50 15 L 80 30 L 80 70 L 50 85 L 20 70 L 20 30 Z" 
          fill="none" 
          stroke="#00D9FF" 
          stroke-width="1" 
          opacity="0.4"/>

    <!-- The "T" as a candlestick -->
    <!-- Vertical body -->
    <rect x="42" y="30" width="16" height="40" rx="3" fill="url(#iconGrad)" filter="url(#glow)"/>

    <!-- Upper wick (going up - bullish) -->
    <line x1="50" y1="30" x2="50" y2="15" stroke="#00FF88" stroke-width="3" stroke-linecap="round"/>

    <!-- Lower wick -->
    <line x1="50" y1="70" x2="50" y2="85" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>


    <!-- Small dot accent -->
    <circle cx="65" cy="25" r="3" fill="#00FF88" filter="url(#glow)"/>
    <circle cx="35" cy="75" r="2" fill="#00D9FF" opacity="0.6"/>
  </g>

  <!-- WORDMARK: TRIVARO -->
  <g transform="translate(125, 68)">
    <!-- T -->
    <text x="0" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-1">T</text>
    <!-- R -->
    <text x="28" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">R</text>
    <!-- I -->
    <text x="55" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">I</text>
    <!-- V -->
    <text x="70" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="700" fill="#00D9FF" letter-spacing="-1">V</text>
    <!-- A -->
    <text x="97" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">A</text>
    <!-- R -->
    <text x="125" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="700" fill="#FFFFFF" letter-spacing="-1">R</text>
    <!-- O -->
    <text x="153" y="0" font-family="'Inter', 'SF Pro Display', system-ui, sans-serif" 
          font-size="42" font-weight="700" fill="#00FF88" letter-spacing="-1">O</text>

    <!-- Subtle underline accent -->
    <line x1="97" y1="12" x2="125" y2="12" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Tagline -->
  <text x="125" y="95" font-family="'Inter', system-ui, sans-serif" 
        font-size="11" font-weight="500" fill="#00D9FF" opacity="0.7" letter-spacing="3">PROP TRADING</text>
</svg>