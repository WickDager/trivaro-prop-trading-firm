<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="50%" style="stop-color:#0D1F35"/>
      <stop offset="100%" style="stop-color:#1A2A40"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#00FF88"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.1"/>
    </pattern>

    <filter id="bannerGlow">
      <feGaussianBlur stdDeviation="8"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#bannerGrad)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="250" r="180" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.1"/>
  <circle cx="200" cy="250" r="220" fill="none" stroke="#00FF88" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1300" cy="250" r="150" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.1"/>

  <!-- Large icon -->
  <g transform="translate(100, 150) scale(2)">
    <path d="M 50 5 L 90 25 L 90 75 L 50 95 L 10 75 L 10 25 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="2" filter="url(#bannerGlow)"/>
    <rect x="42" y="30" width="16" height="40" rx="3" fill="url(#accentGrad)" opacity="0.8"/>
    <line x1="50" y1="30" x2="50" y2="15" stroke="#00FF88" stroke-width="3" stroke-linecap="round"/>
    <circle cx="65" cy="25" r="3" fill="#00FF88"/>
  </g>

  <!-- Brand name -->
  <text x="350" y="260" font-family="'Inter', system-ui, sans-serif" font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">TRIVARO</text>
  <text x="355" y="310" font-family="'Inter', system-ui, sans-serif" font-size="24" font-weight="500" fill="#00D9FF" letter-spacing="8">PROP TRADING FIRM</text>

  <!-- Accent line -->
  <line x1="350" y1="330" x2="700" y2="330" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Right side decorative chart -->
  <g transform="translate(1100, 180)" opacity="0.3">
    <polyline points="0,100 30,70 60,85 90,50 120,60 150,30 180,40 210,10" 
              fill="none" stroke="#00FF88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="210" cy="10" r="6" fill="#00FF88" filter="url(#bannerGlow)"/>
  </g>

  <!-- Bottom tagline area -->
  <rect x="0" y="450" width="1500" height="50" fill="#0A1628" opacity="0.5"/>
  <text x="750" y="482" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#00D9FF" opacity="0.6" letter-spacing="4">FUNDED TRADERS. REAL PROFITS. ZERO RISK.</text>
</svg>