<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="monoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#00FF88"/>
    </linearGradient>
    <filter id="monoGlow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="80" height="80" rx="16" fill="#0A1628"/>
  <rect x="2" y="2" width="76" height="76" rx="14" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>

  <!-- T letter stylized -->
  <path d="M 20 22 L 60 22" stroke="url(#monoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#monoGlow)"/>
  <path d="M 40 22 L 40 58" stroke="url(#monoGrad)" stroke-width="4" stroke-linecap="round" filter="url(#monoGlow)"/>

  <!-- Arrow pointing up (growth) -->
  <path d="M 40 12 L 35 20 L 40 16 L 45 20 Z" fill="#00FF88"/>

  <!-- Subtle chart line -->
  <polyline points="22,55 30,48 38,52 46,42 54,38" 
            fill="none" stroke="#00D9FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>