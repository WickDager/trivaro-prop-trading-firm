<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2A40;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="candleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>

    <filter id="iconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle with gradient -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="#00D9FF" stroke-width="1.5" opacity="0.9"/>

  <!-- Inner ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.3"/>

  <!-- Hexagon frame -->
  <path d="M 60 15 L 103 38 L 103 82 L 60 105 L 17 82 L 17 38 Z" 
        fill="none" stroke="url(#candleGrad)" stroke-width="2.5" filter="url(#iconGlow)"/>

  <!-- Candlestick body -->
  <rect x="50" y="35" width="20" height="45" rx="4" fill="url(#candleGrad)" filter="url(#iconGlow)"/>

  <!-- Upper wick (bullish green) -->
  <line x1="60" y1="35" x2="60" y2="18" stroke="#00FF88" stroke-width="4" stroke-linecap="round" filter="url(#iconGlow)"/>

  <!-- Lower wick -->
  <line x1="60" y1="80" x2="60" y2="95" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Accent dots -->
  <circle cx="78" cy="28" r="4" fill="#00FF88" filter="url(#iconGlow)"/>
  <circle cx="42" cy="88" r="3" fill="#00D9FF" opacity="0.6"/>

  <!-- Mini chart line decoration -->
  <polyline points="25,70 35,60 45,65 55,50" 
            fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>